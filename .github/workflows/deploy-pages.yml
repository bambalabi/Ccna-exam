name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate question bank
        run: node scripts/validate-questions.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Cache-bust CSS/JS: stamp asset URLs with the commit SHA so browsers
      # never pair a fresh index.html with stale cached scripts.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s|\.js\"|.js?v=${v}\"|g; s|\.css\"|.css?v=${v}\"|g" index.html
          grep -F "?v=${v}" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
